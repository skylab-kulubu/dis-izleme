/* skylcn-ui tokens.css'ten alınan alt küme. Koyu varsayılan; data-theme="light" açık. */
:root, [data-theme='dark'] {
  color-scheme: dark;
  --background: #171717;
  --sheet: #121212;
  --card: #1e1e1e;
  --popover: #2a2a2a;
  --foreground: #f5f5f5;
  --foreground-strong: #fafafa;
  --muted-foreground: #a3a3a3;
  --subtle-foreground: #8c8c8c;
  --border: rgb(255 255 255 / 10%);
  --border-subtle: rgb(255 255 255 / 5%);
  --border-strong: rgb(255 255 255 / 20%);
  --accent: rgb(255 255 255 / 5%);
  --primary: #e0c8e5;
  --ring: rgb(235 213 238 / 60%);
  --ok: #34d399;
  --yavas: #fbbf24;
  --kesinti: #f87171;
  --bakim: #93c5fd;
  --veriyok: #404040;
  --elevation-overlay: 0 20px 40px -12px rgb(0 0 0 / 60%);
}
[data-theme='light'] {
  color-scheme: light;
  --background: #f6f4f1;
  --sheet: #ffffff;
  --card: #ffffff;
  --popover: #ffffff;
  --foreground: #1c1a18;
  --foreground-strong: #121014;
  --muted-foreground: #57524c;
  --subtle-foreground: #6b665f;
  --border: rgb(0 0 0 / 10%);
  --border-subtle: rgb(0 0 0 / 6%);
  --border-strong: rgb(0 0 0 / 18%);
  --accent: rgb(0 0 0 / 5%);
  --primary: #8f5e98;
  --ring: rgb(117 68 127);
  --ok: #036648;
  --yavas: #a44a07;
  --kesinti: #b91c1c;
  --bakim: #1d4ed8;
  --veriyok: #d6d1cb;
  --elevation-overlay: 0 20px 40px -16px rgb(28 26 24 / 25%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    color-scheme: light;
    --background: #f6f4f1; --sheet: #ffffff; --card: #ffffff; --popover: #ffffff;
    --foreground: #1c1a18; --foreground-strong: #121014; --muted-foreground: #57524c; --subtle-foreground: #6b665f;
    --border: rgb(0 0 0 / 10%); --border-subtle: rgb(0 0 0 / 6%); --border-strong: rgb(0 0 0 / 18%);
    --accent: rgb(0 0 0 / 5%); --primary: #8f5e98; --ring: rgb(117 68 127);
    --ok: #036648; --yavas: #a44a07; --kesinti: #b91c1c; --bakim: #1d4ed8; --veriyok: #d6d1cb;
    --elevation-overlay: 0 20px 40px -16px rgb(28 26 24 / 25%);
  }
}
:root {
  --font-sans: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
  --radius: 0.5rem;
  --label-spacing: 0.18em;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
}
a { color: var(--primary); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
.gizli { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.atla { position: absolute; left: 16px; top: -40px; background: var(--card); color: var(--foreground); padding: 8px 12px; border-radius: var(--radius); z-index: 10; }
.atla:focus { top: 12px; }

.kap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

header.ust { border-bottom: 1px solid var(--border); background: var(--sheet); }
header.ust .kap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
.marka { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--foreground-strong); }
.marka b { font-family: var(--font-mono); font-weight: 400; letter-spacing: var(--label-spacing); font-size: 14px; }
.marka span { color: var(--muted-foreground); font-size: 14px; }
.ust-sag { display: flex; align-items: center; gap: 8px; }
.dugme {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: transparent;
  color: var(--foreground); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer;
}
.dugme:hover { background: var(--accent); }
.dugme svg { width: 16px; height: 16px; flex: none; }

.uyari-satir { margin: 16px 0 0; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 14px; color: var(--muted-foreground); }
.grup-ad { margin: 0; padding: 12px 20px 0; font-family: var(--font-mono); font-weight: 400; font-size: 12px; letter-spacing: var(--label-spacing); text-transform: uppercase; color: var(--subtle-foreground); }
.grup + .grup { border-top: 1px solid var(--border); }
.hizmet:first-child { border-top: 0; }
.bekle { padding: 20px; color: var(--muted-foreground); }

.genel {
  display: flex; gap: 14px; align-items: flex-start; margin: 16px 0 0; padding: 18px 20px;
  border: 1px solid var(--border); border-left: 4px solid var(--durum-renk, var(--ok));
  border-radius: var(--radius); background: var(--card);
}
.genel .simge { width: 24px; height: 24px; color: var(--durum-renk, var(--ok)); flex: none; margin-top: 1px; }
.genel h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.35; color: var(--foreground-strong); }

section { margin-top: 40px; }
h2 {
  margin: 0 0 12px; font-family: var(--font-mono); font-weight: 400; font-size: 12px;
  letter-spacing: var(--label-spacing); text-transform: uppercase; color: var(--muted-foreground);
}
.kart { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }

/* Planlı bakım */
.bakim { padding: 18px 20px; }
.bakim-bas { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.bakim h3, .olay h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--foreground-strong); }
.etiket {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--durum-renk);
}
.etiket svg { width: 16px; height: 16px; flex: none; }
.meta { color: var(--muted-foreground); font-size: 14px; margin: 4px 0 0; }
.etkilenen { margin: 8px 0 0; font-size: 14px; }

/* Zaman çizelgesi (olay güncellemeleri) */
ol.cizelge { list-style: none; margin: 14px 0 0; padding: 0; }
ol.cizelge li { position: relative; padding: 0 0 14px 22px; }
ol.cizelge li:last-child { padding-bottom: 0; }
ol.cizelge li::before {
  content: ""; position: absolute; left: 4px; top: 8px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--border-strong);
}
ol.cizelge li::after {
  content: ""; position: absolute; left: 7px; top: 19px; bottom: 0; width: 1px; background: var(--border);
}
ol.cizelge li:last-child::after { display: none; }
ol.cizelge .asama { font-weight: 600; font-size: 14px; color: var(--foreground-strong); }
ol.cizelge time { color: var(--muted-foreground); font-size: 13px; margin-left: 8px; font-family: var(--font-mono); }
ol.cizelge p { margin: 2px 0 0; font-size: 14px; }

/* Hizmetler */
.hizmetler { list-style: none; margin: 0; padding: 0; }
.hizmet { padding: 16px 20px 14px; border-top: 1px solid var(--border); }
.hizmet:first-child { border-top: 0; }
.hizmet-bas { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hizmet h3 { margin: 0; font-size: 15px; font-weight: 500; color: var(--foreground-strong); }
.hizmet h3 small { font-weight: 400; color: var(--muted-foreground); font-size: 13px; margin-left: 6px; }

.cubuk {
  display: flex; gap: 2px; height: 34px; margin-top: 10px; padding: 2px; margin-left: -2px; margin-right: -2px;
  border-radius: 4px; touch-action: manipulation;
}
.cubuk:focus-visible { outline-offset: 1px; }
.gun { flex: 1 1 0; min-width: 0; border-radius: 2px; background: var(--ok); cursor: default; }
.gun[data-d='yavas'] { background: var(--yavas); }
.gun[data-d='kesinti'] { background: var(--kesinti); }
.gun[data-d='bakim'] { background: var(--bakim); }
.gun[data-d='veriyok'] { background: var(--veriyok); }
.gun.secili { outline: 2px solid var(--foreground); outline-offset: 1px; }
.cubuk-alt {
  display: flex; justify-content: space-between; gap: 8px; margin-top: 6px;
  font-size: 12px; color: var(--muted-foreground); font-family: var(--font-mono);
}
.cubuk-alt .yuzde { color: var(--foreground); }
.kisa30 { display: none; }

.ipucu {
  position: absolute; z-index: 50; pointer-events: none; max-width: 240px; padding: 10px 12px;
  background: var(--popover); color: var(--foreground); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--elevation-overlay); font-size: 13px; line-height: 1.45;
}
.ipucu[hidden] { display: none; }
.ipucu .t { font-weight: 600; color: var(--foreground-strong); }
.ipucu .e { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--durum-renk); font-weight: 500; }
.ipucu .e svg { width: 14px; height: 14px; }
.ipucu .n { margin-top: 2px; color: var(--muted-foreground); }

/* Olay geçmişi */
.ay { margin-top: 20px; }
.ay:first-of-type { margin-top: 0; }
.ay h3.ay-ad { margin: 0 0 8px; font-size: 15px; font-weight: 500; color: var(--foreground-strong); padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.ay .bos { margin: 0; color: var(--muted-foreground); font-size: 14px; }
.olay { padding: 18px 20px; }
.olay + .olay { margin-top: 12px; }

/* Alt bilgi: yildizskylab.com footer'ının kısaltılmışı (skylab-site Footer.tsx). Logo ve simgeler satır içi SVG. */
.alt { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 20px 40px; margin: 56px 0 0; padding: 28px 0 40px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted-foreground); }
.alt .alt-marka { display: inline-flex; align-items: center; gap: 10px; color: var(--foreground-strong); text-decoration: none; }
.alt-marka svg { width: 32px; height: 30px; flex: none; }
.alt-marka b { font-family: var(--font-mono); font-weight: 400; letter-spacing: var(--label-spacing); font-size: 14px; }
.alt-sag { display: flex; flex-direction: column; gap: 14px; }
.alt-baglanti { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; }
.alt a { color: var(--muted-foreground); }
.alt a:hover { color: var(--foreground); }
.alt-baglanti a { text-decoration: none; }
.alt-baglanti a:hover { text-decoration: underline; }
.alt-sosyal { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
.alt-sosyal a { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius); }
.alt-sosyal a:hover { background: var(--accent); border-color: var(--border-strong); }
.alt-sosyal svg { width: 18px; height: 18px; }

/* Renk kodları */
.ok { --durum-renk: var(--ok); }
.yavas { --durum-renk: var(--yavas); }
.kesinti { --durum-renk: var(--kesinti); }
.bakim-r { --durum-renk: var(--bakim); }
.veriyok { --durum-renk: var(--muted-foreground); }

@media (max-width: 640px) {
  body { font-size: 15px; }
  .genel { padding: 16px; }
  .genel h1 { font-size: 18px; }
  .hizmet, .bakim, .olay { padding-left: 16px; padding-right: 16px; }
  /* Dar ekranda son 30 gün (GitHub Status da böyle yapar); yüzde de 30 günlük */
  .gun:nth-child(-n+60) { display: none; }
  .cubuk { gap: 3px; }
  .kisa90 { display: none; }
  .kisa30 { display: inline; }
  .marka span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .dugme, .gun { transition: background-color .15s ease; }
}
</style>
</head>
